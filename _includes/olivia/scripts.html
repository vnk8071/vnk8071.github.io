<script>
/* Webflow's own CSS keeps the hero, menu and animated blocks hidden until its runtime starts. If that runtime never
   arrives (CDN blocked, offline, content blocker) show the page as plain content instead of leaving it blank. */
(function () {
  var d = document.documentElement;
  window.addEventListener("load", function () {
    setTimeout(function () {
      if (window.Webflow) return;
      d.classList.remove("w-mod-js");
      d.classList.add("wf-fallback");
    }, 2500);
  });
})();
</script>
