{%- assign cp = site.command_palette -%}
{%- if cp.enabled != false -%}
<script type="application/json" id="cmdk-config">{
  "kb": {{ cp.kb_url | default: '/assets/data/kb.json' | relative_url | jsonify }},
  "worker": {{ '/assets/js/palette.worker.js' | relative_url | jsonify }},
  "baseurl": {{ site.baseurl | default: '' | jsonify }},
  "ask": {{ cp.ask_endpoint | default: nil | jsonify }},
  "chatbot": {% if cp.chatbot == false %}false{% else %}true{% endif %},
  "semantic": {{ cp.semantic | default: 'auto' | jsonify }},
  "semanticWindow": {{ cp.semantic_window | default: 0.05 | jsonify }},
  "transformers": {{ cp.transformers_url | jsonify }},
  "model": {{ cp.embedding_model | jsonify }},
  "dtype": {{ cp.embedding_dtype | default: 'q8' | jsonify }},
  "modelMb": {{ cp.embedding_mb | default: 120 | jsonify }},
  "queryPrefix": {{ cp.query_prefix | default: '' | jsonify }},
  "passagePrefix": {{ cp.passage_prefix | default: '' | jsonify }},
  "suggestions": {{ cp.suggestions | jsonify }}
}</script>
<script src="{{ '/assets/js/palette.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M' }}" defer></script>
{%- if cp.chatbot != false -%}
<script src="{{ '/assets/js/chat.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M' }}" defer></script>
{%- endif -%}
{%- endif -%}
